
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quranic Circle | Daily Reminder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <header>
      <p class="brand">QURANIC CIRCLE</p>
      <h1>A Reminder for Your Heart</h1>
      <p class="subtitle">
        Take a moment to pause, reflect and reconnect with Allah.
      </p>
    </header>

    <section class="reminder-card">
      <p class="eyebrow">YOUR QURANIC REMINDER</p>

      <div id="arabic" class="arabic" lang="ar" dir="rtl"></div>

      <p id="translation" class="translation"></p>

      <p id="reference" class="reference"></p>

      <div class="divider"></div>

      <h2>A Moment to Reflect</h2>
      <p id="reflection" class="reflection"></p>
    </section>

    <div class="buttons">
      <button id="nextBtn">✦ Get Another Reminder</button>
      <button id="copyBtn" class="secondary">Copy Reminder</button>
    </div>

    <p id="status" class="status" aria-live="polite"></p>

    <footer>
      <p>May every reminder bring your heart closer to Allah.</p>
      <span>Quranic Circle © 2026</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
